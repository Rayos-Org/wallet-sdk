name: Sync Contract Bindings

on:
  schedule:
    - cron: '0 2 * * *' # Nightly at 2am UTC
  workflow_dispatch: # Allow manual trigger

# Required to push branches and open PRs
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Stellar CLI
        run: |
          # Install Stellar CLI via cargo (most reliable on ubuntu-latest)
          wget -q https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-$(uname -m)-unknown-linux-gnu.tar.gz -O stellar-cli.tar.gz || \
          curl -sSL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          stellar --version

      - name: Regenerate Bindings
        env:
          WALLET_CONTRACT_ADDRESS: ${{ secrets.WALLET_CONTRACT_ADDRESS }}
          FACTORY_CONTRACT_ADDRESS: ${{ secrets.FACTORY_CONTRACT_ADDRESS }}
          POLICY_CONTRACT_ADDRESS: ${{ secrets.POLICY_CONTRACT_ADDRESS }}
          NETWORK: testnet
        run: |
          if [ -z "$WALLET_CONTRACT_ADDRESS" ]; then
            echo "Secrets not set. Skipping."
            exit 0
          fi
          bash scripts/regenerate-bindings.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/contracts/generated/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Open PR if bindings changed
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync contract bindings from wallet-contracts'
          title: 'chore: sync contract bindings'
          body: |
            Automated PR: regenerated contract bindings from the latest deployed contracts.

            Please review the diff in `src/contracts/generated/` and merge if correct.
          branch: chore/sync-bindings
          labels: chore,automated

      - name: No changes detected
        if: steps.diff.outputs.changed == 'false'
        run: echo "Bindings are already up to date. No PR needed."
