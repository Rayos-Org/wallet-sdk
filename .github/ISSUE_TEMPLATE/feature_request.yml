name: Feature Request
description: Suggest a new feature or API addition for wallet-sdk
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please remember: if an app needs to reach into `contracts/generated` directly, that is a signal the public API is missing something and should be extended here.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or gap in the current API.
      placeholder: "Currently, there is no way to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or API you would like to see.
    validations:
      required: true

  - type: textarea
    id: api-sketch
    attributes:
      label: API sketch (optional)
      description: If proposing a new method or type, sketch how it would look.
      render: typescript

  - type: dropdown
    id: willing-to-implement
    attributes:
      label: Are you willing to implement this?
      options:
        - "Yes, I will open a PR"
        - "Yes, with guidance"
        - "No, just suggesting"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
